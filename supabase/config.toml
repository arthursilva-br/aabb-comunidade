project_id = "aabb-comunidade-dev"

[api]
enabled = true
port = 54321
schemas = ["aabb_api"]
extra_search_path = []
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth/recuperar"]
jwt_expiry = 300
enable_signup = false
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
minimum_password_length = 12

[auth.rate_limit]
email_sent = 20

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
otp_expiry = 900
secure_password_change = true

[auth.sessions]
timebox = "8h"
inactivity_timeout = "30m"
